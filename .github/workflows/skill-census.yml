name: skill-census

# Weekly org-wide skill census. Two-mode engine:
#
#   Mode A (always) — .github/scripts/census_counters.py. Deterministic,
#     stdlib-only counters: what each consumer repo subscribes vs. carries
#     locally, catalog subscription coverage, convergent local skills, docket
#     staleness. Emits census.json + digest.md. This is the guaranteed
#     deliverable — it ships even when the LLM panel is unavailable.
#
#   Mode B (when ANTHROPIC_API_KEY is present) — .github/scripts/census_panel.py.
#     Reads census.json and produces verdicts.json (gap / placement / revise /
#     promotion-candidate / demotion-candidate proposals). The panel step is
#     JUDGMENT; filing those verdicts as issues is the FILING step below —
#     dry_run suppresses filing, never judgment. The panel leaves
#     panel_status.json on every handled path (a crash or a kill leaves none,
#     and that fails the run), and the digest opens with one line saying what the
#     panel did: ran, off (no key), held back (partial census) or did not run
#     and why. Only a failure known to pass by itself (timeout, connection,
#     rate limit, 5xx, an unusable answer) leaves the run green; any other
#     failure, and a missing or unreadable record, fails the run in the
#     last step, "Panel health", AFTER the digest and artifacts are written, so
#     the scheduled-run alarm fires; a transient one prints a warning
#     and stays green, and the digest line says so.
#
# Auth: two thrillmade-orchestrator App installation tokens, minted per run.
# A metadata-only lookup token lets `census_counters.py --resolve` check which
# repositories the installation can see; the steward token is then scoped to
# exactly that list (this repository plus every visible consumer in
# CONSUMER_REPOS, the only list) and reads the consumers and files issues
# here. A consumer that cannot be seen costs a warning and is reported NOT
# READ — it no longer fails the token request for every repository (#313).
# Requires the org secrets THRILLMADE_ORCHESTRATOR_APP_ID +
# THRILLMADE_ORCHESTRATOR_PRIVATE_KEY to be visible to this repository — the
# secret-guard step fails loudly with remediation if they are not.
#
# Alarms: the `alarm` job files (or comments on) one "Scheduled workflow
# failing: skill-census" issue when a scheduled run does not succeed, closes it
# again when a scheduled run succeeds, and
# census-watchdog.yml files into the same issue when no scheduled run has
# succeeded for two weekly cadences — which also catches a census that never
# started. This repo's own name comes from the run context everywhere.
#
# Idempotency: one digest issue per ISO-week cycle (commented on re-run, not
# duplicated); every OTHER open digest is closed as superseded once this
# cycle's is filed, so exactly one stays open at a time; verdict issues
# de-duplicated by exact title; hard cap of 5 verdict issues filed per cycle
# with the overflow count surfaced in the digest. See the "File issues" step.

on:
  schedule:
    # Mondays 12:00 UTC — the org's weekly rhythm.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print would-be issue creates/comments to the log instead of filing them."
        type: boolean
        required: false
        default: false

concurrency:
  group: skill-census
  cancel-in-progress: false

permissions:
  # No issues: write here — checkout is the only step still on github.token,
  # and it only needs contents:read. Filing (the panel and File issues steps)
  # runs on the minted App token instead, which sets no permission-<x>
  # inputs and so inherits the installation's own permissions (Issues:
  # read/write since 2026-07-17, #183) — this block does not govern it.
  # Widen this only if a future step goes back to github.token for
  # something that needs it. The `alarm` job is the one exception and
  # carries its own job-level `issues: write`, so the census job never holds
  # it.
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout catalog
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Loud fail if the App secrets aren't visible to this repo. Missing
      # ANTHROPIC_API_KEY does NOT fail — it only degrades to Mode B (digest
      # only), so we emit a warning and flip the panel_enabled output off.
      - name: Guard org secrets + resolve panel mode
        id: guard
        env:
          ORCH_APP_ID: ${{ secrets.THRILLMADE_ORCHESTRATOR_APP_ID }}
          ORCH_PRIVATE_KEY: ${{ secrets.THRILLMADE_ORCHESTRATOR_PRIVATE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          SELF_NAME="${GITHUB_REPOSITORY#*/}"
          missing=0
          if [ -z "${ORCH_APP_ID:-}" ]; then
            echo "::error::THRILLMADE_ORCHESTRATOR_APP_ID is empty. Remediation: extend org-secret visibility to ${SELF_NAME} (org Settings -> Secrets and variables -> Actions -> the secret -> Repository access -> add ${SELF_NAME})."
            missing=1
          fi
          if [ -z "${ORCH_PRIVATE_KEY:-}" ]; then
            echo "::error::THRILLMADE_ORCHESTRATOR_PRIVATE_KEY is empty. Remediation: extend org-secret visibility to ${SELF_NAME} (org Settings -> Secrets and variables -> Actions -> the secret -> Repository access -> add ${SELF_NAME})."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::ANTHROPIC_API_KEY is empty — degrading to Mode B (deterministic digest only, no LLM panel). Extend the ANTHROPIC_API_KEY org secret to ${SELF_NAME} to enable verdicts."
            echo "panel_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "panel_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Names are looked up before the steward token is requested: GitHub
      # refuses a token request outright (HTTP 422) if one listed name does
      # not resolve, and one renamed consumer stopped the census four Mondays
      # running that way (#313). This token is limited to metadata read and is
      # used for nothing but listing what the installation can see. No
      # `repositories:` here on purpose — the listing must cover the whole
      # installation to tell a missing name from a present one. The listing
      # contains private names and is never printed.
      - name: Mint repository-lookup token (metadata only)
        id: lookup_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.THRILLMADE_ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.THRILLMADE_ORCHESTRATOR_PRIVATE_KEY }}
          owner: thrillmade
          permission-metadata: read
          # This token can name every repository in the installation, and later
          # steps install third-party code. --resolve tries to revoke it the
          # moment the listing is done. That is best effort: if the DELETE fails
          # or times out, or the job dies before it, the token lives until it
          # expires (up to an hour), and with the revoke below skipped nothing
          # else removes it. The end-of-job revoke is skipped anyway: the
          # third-party install it would protect against runs BEFORE the end of
          # the job, so revoking then adds nothing there, and on every healthy
          # run it would only warn about a token already gone.
          skip-token-revoke: "true"

      # Writes `repositories=<this repo>,<each visible consumer>` from
      # CONSUMER_REPOS (the only list). A consumer the installation cannot see
      # gets one ::warning:: and is reported NOT READ by the counters. Exits 1
      # with NO output if this repo or every consumer is invisible.
      - name: Resolve census repositories
        id: resolve
        env:
          LOOKUP_TOKEN: ${{ steps.lookup_token.outputs.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/census_counters.py --resolve

      # Scoped to exactly the resolved list. The App has held Issues:
      # read/write since 2026-07-17 (#183) — the panel and File issues steps
      # below file under this token, as the steward identity, which is why
      # this repository leads the list.
      #
      # Fails CLOSED. No `owner:` here, deliberately: with `owner` set, the
      # pinned action reads an empty `repositories` (or one that is only
      # whitespace or commas) as "every repository the installation can see";
      # without it, as this repository alone. The `owner/name` entries
      # --resolve writes carry the owner themselves, and the action checks it
      # against this repository's owner. --resolve never writes an empty list,
      # and the `if:` skips the step on a literally empty one; this is the
      # layer that holds if both are ever wrong.
      - name: Mint steward App token
        id: app_token
        if: ${{ steps.resolve.outputs.repositories != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.THRILLMADE_ORCHESTRATOR_APP_ID }}
          private-key: ${{ secrets.THRILLMADE_ORCHESTRATOR_PRIVATE_KEY }}
          repositories: ${{ steps.resolve.outputs.repositories }}

      # Mode A — deterministic counters. Stdlib only; runs on the bare runner
      # (no setup-python / pip) before the panel step installs anything. A
      # consumer it cannot read under its own name is named in a ::warning::
      # and at the top of the digest, and the summary line says `partial`;
      # the step fails only when it read no consumer at all.
      - name: Census counters (Mode A)
        id: counters
        env:
          STEWARD_TOKEN: ${{ steps.app_token.outputs.token }}
          OUT_DIR: ${{ runner.temp }}/census
        run: |
          set -euo pipefail
          python3 .github/scripts/census_counters.py

      # Mode B — LLM judgment. Runs whenever the panel is enabled, INCLUDING
      # dry_run (we gate FILING, not judgment). continue-on-error stays false:
      # the script owns its own failure handling and exits 0 on API failure
      # after writing panel_status.json, so an infra hiccup inside it degrades
      # to digest-only rather than killing the run before the digest is filed;
      # the "Panel health" step at the end decides whether the failure is one
      # a person has to fix. On a PARTIAL census the script writes no verdicts
      # and records held_back, so the digest files alone: no verdict about a
      # repository nobody read.
      - name: Set up Python (panel)
        if: steps.guard.outputs.panel_enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install anthropic SDK (panel)
        if: steps.guard.outputs.panel_enabled == 'true'
        run: pip install anthropic

      - name: Census panel (judgment)
        id: panel
        if: steps.guard.outputs.panel_enabled == 'true'
        continue-on-error: false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CENSUS_DIR: ${{ runner.temp }}/census
          # Reads the open `census` docket via `gh issue list` in THIS repo
          # (GITHUB_REPOSITORY), under the steward App identity. The App has
          # held Issues: read/write since 2026-07-17 (#183) — the blocker was
          # never a missing grant, it was this token's repo scope omitting
          # this repository, which the resolved list above always leads with.
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          # THE BOUNDARY, AND ITS LIMIT. census_panel.py runs next to a
          # third-party SDK that holds the API key, and this log is public.
          # The guarantee is against an honest or buggy dependency: whatever
          # it raises, logs, warns or prints never reaches the log, the job
          # summary, an issue or an uploaded file, and a failure is reported
          # from a validated record. It does NOT claim to contain a
          # deliberately malicious dependency: code that holds the key and can
          # open a network connection cannot be contained by anything in this
          # workflow. Pinning the dependency by hash answers that threat, and
          # is a separate change, out of scope here.
          #
          # How: both streams go to /dev/null; the runner's file-command
          # variables are removed from the script's environment, so a library
          # that writes to them by mistake cannot; and what crosses is
          # panel_status.json, which panel_record.sh checks against a closed
          # vocabulary and rewrites from fixed phrases. Every step that prints
          # or uploads from the record runs that check itself, immediately
          # before, and reads from its output. verdicts.json and the digest
          # carry the model's answer by design and are filed and uploaded; the
          # script writes no exception text to them. Anything in the census
          # directory that is not a regular file is removed after the script
          # exits. The script's exit status is kept and re-raised.
          set -uo pipefail
          rc=0
          env -u GITHUB_STEP_SUMMARY -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH -u GITHUB_STATE \
            python3 .github/scripts/census_panel.py >/dev/null 2>&1 || rc=$?
          if ! bash .github/scripts/panel_record.sh "$CENSUS_DIR" "$rc" >/dev/null 2>&1; then
            # Could not check the record: it is not trusted, so it is not kept.
            rm -f "${CENSUS_DIR}/panel_status.json"
            [ "$rc" -ne 0 ] || rc=1
          fi
          exit "$rc"

      # File the digest (always, if counters produced one) and any verdict
      # issues (Mode B). Runs even if the panel step failed unexpectedly, so
      # an infra failure never swallows the digest. dry_run prints instead of
      # filing. All issue bodies are passed via --body-file — untrusted
      # (LLM-authored) content is never interpolated into a shell command.
      - name: File issues (digest + verdicts)
        id: file_issues
        if: ${{ !cancelled() && steps.counters.outcome == 'success' }}
        env:
          # Files under the steward App identity, not github-actions[bot].
          # The App has held Issues: read/write since 2026-07-17 (#183); this
          # is the same token minted above, scoped to include this repository.
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          CENSUS_DIR: ${{ runner.temp }}/census
          DRY_RUN: ${{ inputs.dry_run }}
          PANEL_ENABLED: ${{ steps.guard.outputs.panel_enabled }}
          PANEL_OUTCOME: ${{ steps.panel.outcome }}
        run: |
          set -euo pipefail

          DRY_RUN="${DRY_RUN:-false}"

          # One cycle-tag computation (ISO week, UTC). CYCLE_TAG matches the
          # `cycle` field census_counters.py writes into census.json.
          CYCLE_WEEK="$(date -u +%G-W%V)"      # e.g. 2026-W29
          CYCLE_TAG="census-${CYCLE_WEEK}"     # e.g. census-2026-W29
          DIGEST_TITLE="census ${CYCLE_WEEK} digest"

          echo "Cycle: ${CYCLE_TAG} (dry_run=${DRY_RUN})"

          # Ensure the cycle labels exist (idempotent, --force is create-or-update).
          for lbl in census gap placement revise promotion-candidate demotion-candidate; do
            gh label create "$lbl" --force >/dev/null 2>&1 || true
          done

          DIGEST_FILE="${CENSUS_DIR}/digest.md"
          VERDICTS_FILE="${CENSUS_DIR}/verdicts.json"

          if [ ! -f "$DIGEST_FILE" ]; then
            echo "::error::digest.md missing at ${DIGEST_FILE} — Mode A did not produce a digest."
            exit 1
          fi

          # Resolve verdict count + Mode-B state. A Mode-B marker is either a
          # missing verdicts.json, a {"mode":"b"} payload, or an empty
          # .verdicts array — all mean "digest only, no verdict issues".
          VERDICT_COUNT=0
          MODE_B=1
          if [ -f "$VERDICTS_FILE" ]; then
            MODE=$(jq -r '.mode // ""' "$VERDICTS_FILE" 2>/dev/null || echo "")
            VERDICT_COUNT=$(jq '(.verdicts // []) | length' "$VERDICTS_FILE" 2>/dev/null || echo 0)
            if [ "$MODE" = "b" ]; then
              echo "::notice::Panel wrote a Mode-B marker (API unavailable) — filing digest only."
              VERDICT_COUNT=0
            fi
            if [ "$VERDICT_COUNT" -gt 0 ]; then
              MODE_B=0
            fi
          else
            echo "::notice::No verdicts.json present — Mode B (deterministic digest only)."
          fi

          MAX_VERDICTS=5
          OVERFLOW=0
          if [ "$VERDICT_COUNT" -gt "$MAX_VERDICTS" ]; then
            OVERFLOW=$(( VERDICT_COUNT - MAX_VERDICTS ))
          fi

          # Digest body = digest.md, plus an overflow note when the panel
          # produced more than the 5-issue cap.
          #
          # One line under the title says what the panel did this cycle, in
          # every state, so a silent panel cannot read as a quiet census. It is
          # built from the record panel_record.sh has just checked, which
          # carries only fixed strings and counts (never provider error text),
          # and goes in before any early exit below. The record is read once,
          # from the checker's own output; the file is never opened again.
          P_STATE=""
          P_CODE=""
          P_REASON=""
          P_N=0
          P_K=0
          if [ "${PANEL_ENABLED:-}" != "true" ]; then
            P_STATE="off"
          elif REC="$(bash .github/scripts/panel_record.sh "$CENSUS_DIR" 2>/dev/null)" && [ -n "$REC" ]; then
            P_STATE=$(jq -r '.state // ""' <<<"$REC" 2>/dev/null || echo "")
            P_CODE=$(jq -r '.reason_code // ""' <<<"$REC" 2>/dev/null || echo "")
            P_REASON=$(jq -r '.reason // ""' <<<"$REC" 2>/dev/null || echo "")
            P_N=$(jq -r '.verdicts // 0' <<<"$REC" 2>/dev/null || echo 0)
            P_K=$(jq -r '.keeps // 0' <<<"$REC" 2>/dev/null || echo 0)
          fi
          case "$P_STATE" in
            ran)
              PANEL_LINE="> **Panel:** ran: ${P_N} verdict(s), ${P_K} kept."
              PANEL_PLAIN="ran: ${P_N} verdict(s), ${P_K} kept." ;;
            off)
              PANEL_LINE="> **Panel:** off: no API key is visible to this repository, so this digest carries no verdicts."
              PANEL_PLAIN="off: no API key is visible to this repository." ;;
            held_back)
              PANEL_LINE="> **Panel:** held back: the census is partial, so there are no verdicts about repositories it did not read."
              PANEL_PLAIN="held back: the census is partial." ;;
            failed)
              PANEL_LINE="> **Panel did not run this cycle:** ${P_REASON}. This digest carries no verdicts."
              PANEL_PLAIN="did not run: ${P_REASON}." ;;
            *)
              P_STATE="no_record"
              PANEL_LINE="> **Panel did not run this cycle:** the panel step ended without reporting (step outcome: ${PANEL_OUTCOME:-unknown}). See the run log."
              PANEL_PLAIN="did not run: the panel step ended without reporting (step outcome: ${PANEL_OUTCOME:-unknown})." ;;
          esac
          echo "Panel: ${PANEL_PLAIN}"
          echo "panel=${P_STATE}${P_CODE:+:${P_CODE}} ${PANEL_PLAIN}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          DIGEST_BODY_FILE="$(mktemp)"
          {
            head -n 1 "$DIGEST_FILE"
            echo ""
            echo "$PANEL_LINE"
            tail -n +2 "$DIGEST_FILE"
          } > "$DIGEST_BODY_FILE"
          if [ "$OVERFLOW" -gt 0 ]; then
            {
              echo ""
              echo "> **Verdict overflow:** the panel produced ${VERDICT_COUNT} verdicts; only the top ${MAX_VERDICTS} were filed as issues this cycle. ${OVERFLOW} additional verdict(s) were held back — see the verdicts.json workflow artifact."
            } >> "$DIGEST_BODY_FILE"
          fi

          # Append the panel's own reasoning (prosecutor/defender calls, folded
          # candidates) to the digest, when present.
          if [ -f "$VERDICTS_FILE" ]; then
            ADDENDUM=$(jq -r '.digest_addendum_md // ""' "$VERDICTS_FILE" 2>/dev/null || echo "")
            if [ -n "$ADDENDUM" ]; then
              {
                echo ""
                echo "$ADDENDUM"
              } >> "$DIGEST_BODY_FILE"
            fi
          fi

          # Digest issue: one per cycle, commented on re-run (exact-title match).
          EXISTING_DIGEST=$(gh issue list --state open --search "${DIGEST_TITLE} in:title" \
            --json number,title 2>/dev/null \
            | jq -r --arg t "$DIGEST_TITLE" 'map(select(.title == $t)) | .[0].number // empty') \
            || { EXISTING_DIGEST=""; echo "::warning::gh issue list failed while looking up this cycle's digest issue — treating it as absent. A new digest issue may be created even though one is already open, rather than commented on."; }

          DIGEST_NUM="$EXISTING_DIGEST"
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY-RUN: digest issue ==="
            if [ -n "$EXISTING_DIGEST" ]; then
              echo "Would COMMENT on existing digest issue #${EXISTING_DIGEST}:"
            else
              echo "Would CREATE issue '${DIGEST_TITLE}' (label: census):"
            fi
            echo "----- body -----"
            cat "$DIGEST_BODY_FILE"
            echo "----- end body -----"
          else
            if [ -n "$EXISTING_DIGEST" ]; then
              gh issue comment "$EXISTING_DIGEST" --body-file "$DIGEST_BODY_FILE"
              echo "::notice::Updated digest issue #${EXISTING_DIGEST} for ${CYCLE_TAG}."
            else
              DIGEST_URL=$(gh issue create --title "$DIGEST_TITLE" --label census --body-file "$DIGEST_BODY_FILE")
              DIGEST_NUM="${DIGEST_URL##*/}"
              echo "::notice::Created digest issue '${DIGEST_TITLE}' (#${DIGEST_NUM})."
            fi
          fi
          rm -f "$DIGEST_BODY_FILE"

          # Close every previously-filed digest now that this cycle's is filed
          # — a weekly snapshot is superseded by construction the moment the
          # next one ships, and nothing else prunes them (#249: four digests
          # sat open at once, only the newest current). A prior digest is
          # identified by BOTH signals together, never one alone: the "census"
          # label with no OTHER census-scheme label riding along (a verdict
          # always adds gap/placement/revise/promotion-candidate/demotion-
          # candidate on top of census — see the labelling above, so "census"
          # alone is the digest's own signature), and the exact "census
          # <ISO-week> digest" title this workflow itself deterministically
          # generates (never an LLM-authored verdict title). Requiring both
          # means a human hand-labelling some other issue "census", or a
          # verdict whose declared labels all fell through the allow-list
          # above, still can't produce a false close on its own. Excluding
          # this cycle's own title (by construction the one just
          # created/updated) keeps a re-run idempotent — it never closes the
          # digest it just filed.
          PRIOR_DIGESTS=$(gh issue list --state open --label census --json number,title,labels --limit 100 2>/dev/null \
            | jq -r --arg t "$DIGEST_TITLE" '
                [.[] | select((.labels | length) == 1)
                      | select(.title | test("^census [0-9]{4}-W[0-9]{2} digest$"))
                      | select(.title != $t)]
                | .[].number
              ') \
            || { PRIOR_DIGESTS=""; echo "::warning::gh issue list failed while looking up prior digest issues to close — treating it as none. A stale digest from an earlier cycle may be left open this run."; }

          if [ -n "$PRIOR_DIGESTS" ]; then
            while IFS= read -r prior; do
              [ -z "$prior" ] && continue
              NOTE="Superseded by ${DIGEST_TITLE}"
              if [ -n "$DIGEST_NUM" ]; then
                NOTE="${NOTE} (#${DIGEST_NUM})"
              fi
              NOTE="${NOTE} — a weekly snapshot is stale the moment the next one files, closing this one."
              if [ "$DRY_RUN" = "true" ]; then
                echo "=== DRY-RUN: close prior digest #${prior} ==="
                echo "${NOTE}"
              else
                gh issue comment "$prior" --body "$NOTE"
                gh issue close "$prior"
                echo "::notice::Closed prior digest issue #${prior} — ${NOTE}"
              fi
            done <<< "$PRIOR_DIGESTS"
          fi

          if [ "$MODE_B" -eq 1 ]; then
            echo "Mode B — no verdict issues to file."
            exit 0
          fi

          # Verdict issues: hard-cap at 5 (head -5 semantics), bodies via
          # --body-file. Dedup is by `census_key` (a stable `<kind>:<subject-
          # slug>` marker the panel computes deterministically — same subject
          # next cycle produces the same key, no cycle tag in it) — NOT by
          # title, which changes every cycle and was re-filing the identical
          # verdict as a fresh issue three cycles running. A census_key match
          # gets THIS cycle's reasoning as a comment on the existing canonical
          # issue; only a miss creates a new one, and the new body embeds the
          # marker so next cycle's search finds it in turn.
          FILE_N=$VERDICT_COUNT
          if [ "$FILE_N" -gt "$MAX_VERDICTS" ]; then
            FILE_N=$MAX_VERDICTS
          fi

          i=0
          while [ "$i" -lt "$FILE_N" ]; do
            V_TITLE=$(jq -r ".verdicts[$i].title // \"\"" "$VERDICTS_FILE")
            if [ -z "$V_TITLE" ]; then
              echo "::warning::verdict index ${i} has no title — skipping."
              i=$((i + 1))
              continue
            fi

            V_KEY=$(jq -r ".verdicts[$i].census_key // \"\"" "$VERDICTS_FILE")
            if [ -z "$V_KEY" ]; then
              echo "::warning::verdict '${V_TITLE}' has no census_key — falling back to exact-title dedup only, so an identical verdict may re-file next cycle under a new title."
            fi

            V_BODY_FILE="$(mktemp)"
            jq -r ".verdicts[$i].body // \"\"" "$VERDICTS_FILE" > "$V_BODY_FILE"
            if [ -n "$V_KEY" ]; then
              {
                echo ""
                echo "<!-- census-key: ${V_KEY} -->"
              } >> "$V_BODY_FILE"
            fi

            # Labels: always census; add each declared label if it is allowed.
            LABEL_ARGS=(--label census)
            while IFS= read -r l; do
              [ -z "$l" ] && continue
              case "$l" in
                gap|placement|revise|promotion-candidate|demotion-candidate)
                  LABEL_ARGS+=(--label "$l") ;;
                *)
                  echo "::warning::verdict '${V_TITLE}' declares unknown label '${l}' — ignoring." ;;
              esac
            done < <(jq -r ".verdicts[$i].labels // [] | .[]" "$VERDICTS_FILE")

            # Primary lookup: an open issue already carrying this census_key,
            # anywhere in its body OR its comments. `in:body` alone would miss
            # the catalog's first four canonical issues, seeded with the
            # marker as a comment rather than in the body — search both so
            # dedup works for those as well as for every issue this workflow
            # creates from here on (which embeds the marker in the body).
            #
            # A FAILED lookup is not "nothing filed" (#264): read that way it
            # falls through to `gh issue create` and re-files a verdict that
            # is already open. So a failure on either lookup holds the verdict
            # back this cycle, with a warning naming it — the panel proposes
            # the same census_key again next cycle.
            LOOKUP_FAILED=""
            KEY_MATCH=""
            if [ -n "$V_KEY" ]; then
              KEY_MATCH=$(gh issue list --state open \
                --search "\"<!-- census-key: ${V_KEY} -->\" in:body,comments" \
                --json number 2>/dev/null | jq -r '.[0].number // empty') \
                || { KEY_MATCH=""; LOOKUP_FAILED="the census_key lookup (census_key=${V_KEY})"; }
            fi

            if [ -n "$KEY_MATCH" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "=== DRY-RUN: verdict $((i + 1))/${FILE_N} ==="
                echo "Would COMMENT on existing canonical issue #${KEY_MATCH} (census_key=${V_KEY}) instead of filing a new one:"
                echo "----- body -----"
                cat "$V_BODY_FILE"
                echo "----- end body -----"
              else
                gh issue comment "$KEY_MATCH" --body-file "$V_BODY_FILE"
                echo "::notice::census_key=${V_KEY} already tracked as #${KEY_MATCH} — commented this cycle's reasoning instead of re-filing."
              fi
              rm -f "$V_BODY_FILE"
              i=$((i + 1))
              continue
            fi

            # Fallback: no census_key (or no match) — exact-title dedup, same
            # as before, so a verdict never double-files within one title's
            # lifetime even without a usable key.
            EXISTS=""
            if [ -z "$LOOKUP_FAILED" ]; then
              EXISTS=$(gh issue list --state open --search "${V_TITLE} in:title" \
                --json number,title 2>/dev/null \
                | jq -r --arg t "$V_TITLE" 'map(select(.title == $t)) | .[0].number // empty') \
                || { EXISTS=""; LOOKUP_FAILED="the exact-title lookup"; }
            fi

            if [ -n "$LOOKUP_FAILED" ]; then
              echo "::warning::gh issue list failed during ${LOOKUP_FAILED} for verdict '${V_TITLE}' — held back this cycle rather than risk filing a duplicate of an issue that is already open."
              if [ "$DRY_RUN" = "true" ]; then
                echo "=== DRY-RUN: verdict $((i + 1))/${FILE_N} ==="
                echo "Would HOLD BACK (lookup failed): ${V_TITLE}"
              fi
              rm -f "$V_BODY_FILE"
              i=$((i + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "=== DRY-RUN: verdict $((i + 1))/${FILE_N} ==="
              if [ -n "$EXISTS" ]; then
                echo "Would SKIP (already open as #${EXISTS}): ${V_TITLE}"
              else
                echo "Would CREATE '${V_TITLE}' (labels: ${LABEL_ARGS[*]}, census_key=${V_KEY:-<none>}):"
                echo "----- body -----"
                cat "$V_BODY_FILE"
                echo "----- end body -----"
              fi
            else
              if [ -n "$EXISTS" ]; then
                echo "::notice::Verdict already open as #${EXISTS} — skipping: ${V_TITLE}"
              else
                gh issue create --title "$V_TITLE" "${LABEL_ARGS[@]}" --body-file "$V_BODY_FILE"
                echo "::notice::Created verdict issue: ${V_TITLE}"
              fi
            fi
            rm -f "$V_BODY_FILE"
            i=$((i + 1))
          done

      # Stages exactly four regular files for the upload, so the upload never
      # expands a directory or follows a link: the record comes from the
      # checker's own output (checked again here, immediately before), the other
      # three are copied only if they are regular files.
      - name: Stage census artifacts
        id: stage_upload
        if: ${{ !cancelled() }}
        env:
          CENSUS_DIR: ${{ runner.temp }}/census
          STAGE_DIR: ${{ runner.temp }}/census-upload
        run: |
          set -uo pipefail
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"
          if REC="$(bash .github/scripts/panel_record.sh "$CENSUS_DIR" 2>/dev/null)" && [ -n "$REC" ]; then
            printf '%s\n' "$REC" > "${STAGE_DIR}/panel_status.json"
          fi
          for f in census.json digest.md verdicts.json; do
            src="${CENSUS_DIR}/${f}"
            if [ -f "$src" ] && [ ! -L "$src" ]; then
              cp -P -- "$src" "${STAGE_DIR}/${f}" 2>/dev/null || true
              if [ ! -f "${STAGE_DIR}/${f}" ] || [ -L "${STAGE_DIR}/${f}" ]; then
                rm -rf "${STAGE_DIR:?}/${f}"
              fi
            fi
          done

      - name: Upload census artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-census-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/census-upload/census.json
            ${{ runner.temp }}/census-upload/digest.md
            ${{ runner.temp }}/census-upload/verdicts.json
            ${{ runner.temp }}/census-upload/panel_status.json
          if-no-files-found: ignore
          retention-days: 30

      # Fails the run when the panel failed in a way a person has to fix, or
      # left no record at all. Last on purpose: the digest is filed and the
      # artifacts are uploaded by now, and a failed census job is what makes
      # the scheduled-run alarm below fire. A transient failure (timeout, rate
      # limit, 5xx, an unusable answer) and the deliberate no-key mode stay
      # green; the digest line already said so. The panel's own output is
      # never printed (see the panel step): every value on these lines is a
      # checked field of the record the checker has just rewritten, or a fixed
      # phrase.
      - name: Panel health
        id: panel_health
        if: ${{ !cancelled() && steps.guard.outputs.panel_enabled == 'true' }}
        env:
          CENSUS_DIR: ${{ runner.temp }}/census
        run: |
          set -euo pipefail
          # The record is checked here, immediately before it is read, and read
          # once, from the checker's own output; the file is never opened again.
          if ! REC="$(bash .github/scripts/panel_record.sh "$CENSUS_DIR" 2>/dev/null)"; then
            echo "::error::census panel needs attention: panel_status.json could not be checked."
            exit 1
          fi
          if [ -z "$REC" ]; then
            echo "::error::census panel needs attention: the panel step left no record (panel_status.json missing)."
            exit 1
          fi
          STATE=$(jq -r '.state // ""' <<<"$REC")
          CODE=$(jq -r '.reason_code // ""' <<<"$REC")
          REASON=$(jq -r '.reason // ""' <<<"$REC")
          STAGE=$(jq -r '.stage // "unknown"' <<<"$REC")
          HTTP=$(jq -r '.http_status // "none"' <<<"$REC")
          CLS=$(jq -r '.exc_class // "none"' <<<"$REC")
          BG=$(jq -r '.background_error_class // ""' <<<"$REC")
          EXS=$(jq -r '.exit_status // ""' <<<"$REC")
          [ "$CLS" != unrecognised ] || CLS="an unrecognised exception class"
          [ "$BG" != unrecognised ] || BG="an unrecognised exception class"
          DETAIL="state=${STATE} reason=${REASON:-none} code=${CODE:-none} stage=${STAGE} http=${HTTP} class=${CLS}${EXS:+ exit=${EXS}}."
          WITHHELD="The panel's raw output was withheld on purpose (this log is public and the step runs next to the API key). To reproduce, run .github/scripts/census_panel.py locally with ANTHROPIC_API_KEY and CENSUS_DIR set."
          case "$STATE" in
            ran|off|held_back)
              echo "Panel health: ${STATE}."
              if [ -n "$BG" ]; then
                echo "::warning::census panel: a background error of class ${BG} was ignored (the run itself completed). ${WITHHELD}"
              fi ;;
            failed)
              # Fail closed: green only for a code known to pass by itself.
              # Keep in step with TRANSIENT_CODES in census_panel.py.
              case "$CODE" in
                rate_limited|service_error|timeout|connection|invalid_answer)
                  echo "::warning::Panel did not run: ${DETAIL} Known to pass by itself; the run stays green. ${WITHHELD}" ;;
                *)
                  echo "::error::census panel needs attention: ${DETAIL} ${WITHHELD}"
                  exit 1 ;;
              esac ;;
            *)
              echo "::error::census panel needs attention: panel_status.json is unreadable or has no state."
              exit 1 ;;
          esac

  # The census failed four scheduled Mondays running and nobody noticed: it is
  # the thing that files issues, so a census that stops files nothing (#313).
  # This job is outside the census job's failure domain only as far as a job
  # can be — it runs on github.token, with its own `issues: write`, and needs
  # none of the App secrets the census needs. It cannot catch a census that
  # never started (disabled schedule, broken YAML); census-watchdog.yml does,
  # and files into this same issue. Same pattern as logmind-self-update.yml's
  # "Notify on failure": one issue per workflow, found by its marker, then
  # commented on rather than re-filed. Scheduled runs only — a failed manual
  # run already has someone watching it. The same job closes the issue when a
  # scheduled run succeeds: only the schedule proves the schedule works, so a
  # manual run never closes it.
  alarm:
    needs: census
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Notify on failure, close on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CENSUS_RESULT: ${{ needs.census.result }}
        run: |
          set -euo pipefail
          MARKER="<!-- workflow-failure-key: skill-census -->"
          TITLE="Scheduled workflow failing: skill-census"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh label create automation-failure --color B60205 --force >/dev/null 2>&1 || true

          # CAPTURE FILTER, NOT OPTIONAL — three conditions, all required. Anyone
          # can put the marker in an issue or a comment, and this repo is public.
          # (1) Bodies only, never comments: a stranger's comment carrying the
          # marker on any open issue would otherwise match. (2) Authored by
          # github-actions: only a workflow in THIS repo can author as it, and
          # changing a workflow takes a merged PR. (3) Exactly the alarm's title:
          # other bot-authored issues (digests, other workflows' alarms) are
          # open too, and (1)+(2) alone would still accept one of them. A failed
          # lookup files a new issue: a duplicate alarm beats a silent one.
          LOOKUP_OK=1
          EXISTING_ALL=$(gh issue list --state open --search "\"${MARKER}\" in:body" \
            --json number,author,title 2>/dev/null \
            | jq -r --arg t "$TITLE" '[.[] | select(.author.is_bot == true and (.author.login | test("^(app/)?github-actions$")) and .title == $t)] | .[].number') \
            || { EXISTING_ALL=""; LOOKUP_OK=0; echo "::warning::gh issue list failed while looking for an open skill-census failure issue."; }
          # The first match takes the "still failing" comment; recovery closes all.
          EXISTING=$(printf '%s\n' "$EXISTING_ALL" | head -n 1)

          # Recovery: only a scheduled run that succeeded closes the alarm (this
          # job never runs on a manual one). A failed lookup closes nothing.
          if [ "$CENSUS_RESULT" = "success" ]; then
            if [ -n "$EXISTING_ALL" ]; then
              for N in $EXISTING_ALL; do
                gh issue comment "$N" --body "Recovered: the scheduled census succeeded at $(date -u +%Y-%m-%dT%H:%MZ): ${RUN_URL}. Closing; the next failure files a new issue."
                gh issue close "$N" --reason completed
                echo "::notice::Closed failure issue #${N}: the scheduled census recovered."
              done
            elif [ "$LOOKUP_OK" -eq 0 ]; then
              echo "::warning::Could not check for an open failure issue; leaving any open one as it is."
            else
              echo "No open failure issue to close."
            fi
            exit 0
          fi

          if [ "$LOOKUP_OK" -eq 0 ]; then
            echo "::warning::Filing a new failure issue: a duplicate alarm beats a silent one."
          fi

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ) (census job: ${CENSUS_RESULT}): ${RUN_URL}"
            echo "::notice::Commented on existing failure issue #${EXISTING}."
          else
            BODY_FILE="$(mktemp)"
            {
              echo "The **skill-census** scheduled workflow (\`.github/workflows/skill-census.yml\`) did not succeed (census job: ${CENSUS_RESULT})."
              echo ""
              echo "Failing run: ${RUN_URL}"
              echo ""
              echo "This issue is commented on (not re-filed) on every subsequent failure, and by census-watchdog.yml when no scheduled census has succeeded for two weeks — see the marker below."
              echo ""
              echo "$MARKER"
            } > "$BODY_FILE"
            gh issue create --title "$TITLE" --label automation-failure --body-file "$BODY_FILE"
            echo "::notice::Filed new failure issue."
          fi
