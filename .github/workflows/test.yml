name: test

# The repo's test suite. `tests/` characterizes .github/scripts/ -- today
# that is validate_skills.py (the `validate-skills` gate) and
# check_prose_retention.py (the `check-prose-retention` gate), whose rules
# and message text are pinned there so a change to either gate has to be a
# deliberate one.
#
# NOT A REQUIRED CHECK -- AND NEITHER IS ANYTHING ELSE, TODAY. Measured, not
# assumed: all three active rulesets (org-baseline, org-default-protection,
# reporulez-default) carry only deletion, non_fast_forward,
# required_linear_history and pull_request rules, none of them
# required_status_checks, and every one is scoped to the default branch;
# `gh api repos/thrillmade/agent-skills/rules/branches/dev` -- the branch this
# repository's PRs actually target -- returns an empty list, and neither `main`
# nor `dev` carries legacy branch protection either. So this reports without
# blocking. check-prose-retention.yml says the same thing about itself; if that
# ever stops being true, it stops being true in both places at once.
#
# NO `paths:` filter, deliberately, and being unrequired is not a reason to add
# one: a filter-skipped check reports as expected-but-never-reported and blocks
# a merge forever the day it IS required, and the path list rots -- this
# repository already shipped a size gate that could not see edits to its own
# budget file. tests/test_workflow_triggers.py asserts the filter stays absent.
# It also means the catalog's own SKILL.md files are checked on every PR, not
# only the ones validate-skills.yml's filter matches.
#
# The job id stays `test`: it is the name a required_status_checks rule would
# have to name, and renaming it after that rule exists is the same
# expected-but-never-reported failure by another route.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # Pinned deliberately. This suite is what proves every skill gate in
        # this repo actually fires, so an unpinned upgrade can turn it red —
        # or, worse, quietly change what a test asserts — with no commit to
        # point at. Every other tool here is pinned (setup-logmind@v1.0.1,
        # checkout@v7); this is the same rule. Dependabot bumps it.
        run: pip install pytest==8.3.4 pyyaml==6.0.2

      - name: Run tests
        run: pytest tests/ -q
