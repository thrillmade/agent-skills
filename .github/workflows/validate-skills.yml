name: validate-skills

# Validate every SKILL.md under skills/<name>/ on PR + push to main.
# Catches malformed frontmatter (missing name, missing description,
# name mismatch with directory) before it ships to skills.sh, where
# downstream consumers (clud-bug, agent runtimes via skills CLI)
# would silently get broken skills.
#
# Also gates docs/placement-map.json (when present): valid JSON/shape, and
# its `skills` keys reconciled 1:1 against skills/ directory names. This is
# what makes the placement-map guide's claim ("the map is kept in sync")
# actually true instead of aspirational.
#
# Every rule lives in .github/scripts/validate_skills.py, characterized by
# tests/test_validate_skills*.py (run by the `test` workflow). It was an
# inline heredoc here until the tests needed something importable to point
# at -- a gate whose only way to fail is "push a branch and watch CI" has no
# regression guard.

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "docs/placement-map.json"
      - ".github/scripts/validate_skills.py"
      - ".github/workflows/validate-skills.yml"
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "docs/placement-map.json"
      - ".github/scripts/validate_skills.py"
      - ".github/workflows/validate-skills.yml"

permissions:
  contents: read

jobs:
  validate:
    name: validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate every SKILL.md
        # Run from the repo root: the script resolves skills/ and
        # docs/placement-map.json relative to the cwd, and refuses to report
        # success over a tree it did not actually walk.
        run: python .github/scripts/validate_skills.py
