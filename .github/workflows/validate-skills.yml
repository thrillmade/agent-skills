name: validate-skills

# Validate every SKILL.md under skills/<name>/ on PR + push to main.
# Catches malformed frontmatter (missing name, missing description,
# name mismatch with directory) before it ships to skills.sh, where
# downstream consumers (clud-bug, agent runtimes via skills CLI)
# would silently get broken skills.
#
# Also gates docs/placement-map.json (when present): valid JSON/shape, and
# its `skills` keys reconciled 1:1 against skills/ directory names. This is
# what makes the placement-map guide's claim ("the map is kept in sync")
# actually true instead of aspirational.
#
# Every rule lives in .github/scripts/validate_skills.py, characterized by
# tests/test_validate_skills*.py (run by the `test` workflow). It was an
# inline heredoc here until the tests needed something importable to point
# at -- a gate whose only way to fail is "push a branch and watch CI" has no
# regression guard.

# NO `paths:` FILTER, DELIBERATELY. Do not add one back.
#
# Two reasons, and the second is why deleting beats extending.
#
# 1. A filtered run interacts badly with `required_status_checks`. GitHub
#    treats a filter-skipped check as "expected but never reported" and blocks
#    the merge forever — the failure this repo's own check-doc-links.yml:8-12
#    documents. No such rule exists here today, which is exactly why this is
#    free to fix now and expensive later.
#
# 2. A filter has to enumerate every input, and the list only ever grows. This
#    one already missed `skills/skill-size-budget.json` for its whole life —
#    the size gate could not see edits to its own budget, so raising the limit
#    never even triggered the gate it disabled. Extending the list fixes one
#    instance and ships the next: the mirror gate will read `.claude/skills/**`,
#    and the suite reads `tests/**`.
#
# The run is 11-13s over 48 files. Unconditional is cheaper than being wrong.
# A committed test asserts this filter stays absent.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate every SKILL.md
        # Run from the repo root: the script resolves skills/ and
        # docs/placement-map.json relative to the cwd, and refuses to report
        # success over a tree it did not actually walk.
        run: python .github/scripts/validate_skills.py
